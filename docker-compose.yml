services:
  redis:
    image: redis:7-alpine 
    ports:
      - "6379:6379"         
      
  backend:
    build:
      context: . 
      dockerfile: backend/Dockerfile
    volumes:
      - ./backend:/app
      - /app/.venv
    ports:
      - "8000:8000"
    depends_on:
      - redis
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0

  celery:
    build:
      context: . 
      dockerfile: backend/Dockerfile
    command: uv run celery -A config worker --loglevel=info
    volumes:
      - ./backend:/app
      - /app/.venv
    depends_on:
      - redis
      - backend
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0

  nginx:
    build:
      context: . 
      dockerfile: frontend/Dockerfile
    ports:
      - "80:80"                
    depends_on:
      - backend
