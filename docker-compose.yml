services:
  redis:
    image: redis:7-alpine 
    ports:
      - "6379:6379"         
      
  backend:
    build:
      context: . 
      dockerfile: backend/Dockerfile
    volumes:
      - ./backend:/app
      - /app/.venv
    ports:
      - "8000:8000"
    depends_on:
      - redis

  nginx:
    build:
      context: . 
      dockerfile: frontend/Dockerfile
    ports:
      - "80:80"                
    depends_on:
      - backend
