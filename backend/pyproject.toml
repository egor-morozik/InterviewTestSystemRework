[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.14"
dependencies = [
    "celery>=5.6.2",
    "django==6.0.1",
    "django-cors-headers==4.9.0",
    "django-filter==25.2",
    "django-redis==6.0.0",
    "djangorestframework==3.16.1",
    "redis==7.1.0",
    "requests==2.32.5",
]

[dependency-groups]
dev = [
    "ruff==0.14.14",
]

[tool.ruff]
line-length = 120
extend-exclude = ["migrations"]

[tool.ruff.lint]
select = ["I", "E", "F", "B"]
